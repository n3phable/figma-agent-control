version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # Keep type checking aligned with the minimum supported Node.js runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
