name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: verify
    if: github.repository == 'n3phable/figma-agent-control'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - name: Validate tag and create the package
        shell: bash
        run: |
          node scripts/check-release.mjs --tag "$GITHUB_REF_NAME"
          npm pack --json > pack.json
          node --input-type=module -e 'import fs from "node:fs"; const [p] = JSON.parse(fs.readFileSync("pack.json")); fs.appendFileSync(process.env.GITHUB_ENV, `FAC_ARCHIVE=${p.filename}\n`);'
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$FAC_ARCHIVE" --clobber
          else
            prerelease=()
            if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "$FAC_ARCHIVE" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes "${prerelease[@]}"
          fi
      - name: Publish to npm with trusted publishing
        if: vars.PUBLISH_NPM == 'true'
        shell: bash
        run: |
          npm --version
          dist_tag=latest
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then dist_tag=next; fi
          npm publish "$FAC_ARCHIVE" --access public --provenance --tag "$dist_tag"
